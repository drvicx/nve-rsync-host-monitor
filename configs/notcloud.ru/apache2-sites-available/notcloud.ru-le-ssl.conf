<IfModule mod_ssl.c>
<VirtualHost *:443>

    ## ..initial settings

    ## Enables Apache Reverse Proxy
    ProxyPreserveHost On

    ## ESRN RSYNC Monitoring (test) :: Python REST API Service Endpoint
    ProxyPass /apps/esrn-rsync-monitoring-test/ http://localhost:8000/
    ProxyPassReverse /apps/esrn-rsync-monitoring-test/ http://localhost:8000/

    ## ESRN RSYNC Monitoring (prod) :: Python REST API Service Endpoint
    ProxyPass /apps/esrn-rsync-monitoring-prod/ http://localhost:8010/
    ProxyPassReverse /apps/esrn-rsync-monitoring-prod/ http://localhost:8010/

    ## ..other settings

</VirtualHost>
</IfModule>
